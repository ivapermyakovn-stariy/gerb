<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина ко Дню Герба РФ | Моя Россия</title>
    <style>
        :root {
            --gold: #D4AF37;
            --dark-blue: #0A1C3A;
            --red: #B22222;
            --white: #F8F9FA;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif; }

        body {
            background: linear-gradient(135deg, #0A1C3A 0%, #1A2F4E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: var(--white);
            position: relative;
            overflow-x: hidden;
        }

        .bg-symbol {
            position: absolute; opacity: 0.05; font-size: 150px;
            pointer-events: none; user-select: none; z-index: 0;
        }
        .bg-symbol.left { top: 10%; left: -30px; transform: rotate(-15deg); }
        .bg-symbol.right { bottom: 10%; right: -30px; transform: rotate(15deg); }

        .container {
            width: 100%; max-width: 750px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative; z-index: 1;
            margin: 20px 0;
        }

        header { text-align: center; margin-bottom: 30px; }
        .emblem { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6)); }
        h1 {
            font-size: 26px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: var(--gold);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px; color: #ccc; letter-spacing: 1px;
            border-bottom: 2px solid var(--red); display: inline-block; padding-bottom: 5px;
        }

        /* Форма регистрации */
        .registration-form { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: 600; color: var(--gold); font-size: 15px; letter-spacing: 1px; }
        .input-group input {
            padding: 15px 20px; border: 2px solid rgba(212, 175, 55, 0.4);
            background: rgba(0, 0, 0, 0.3); border-radius: 12px;
            color: var(--white); font-size: 16px; transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none; border-color: var(--gold);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.4); }

        .btn {
            padding: 16px 30px; border: none; border-radius: 12px;
            font-size: 18px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; transition: all 0.3s;
            background: linear-gradient(135deg, var(--red) 0%, #8B0000 100%);
            color: white; box-shadow: 0 5px 15px rgba(178, 34, 34, 0.4);
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(178, 34, 34, 0.6); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* Экран викторины */
        .quiz-screen { display: none; }
        .quiz-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .user-info { font-size: 14px; color: var(--gold); font-weight: 600; }
        .user-info span { color: var(--white); font-weight: 400; }

        .progress {
            background: rgba(0,0,0,0.5); height: 8px; border-radius: 4px;
            margin-bottom: 25px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--red), var(--gold));
            border-radius: 4px; transition: width 0.4s ease;
        }

        .question-number { font-size: 14px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .question-text { font-size: 21px; font-weight: 600; line-height: 1.4; margin-bottom: 30px; min-height: 60px; }

        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .option {
            padding: 16px 20px; background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            cursor: pointer; font-size: 16px; transition: all 0.2s; text-align: left;
        }
        .option:hover { background: rgba(212, 175, 55, 0.15); border-color: rgba(212, 175, 55, 0.5); padding-left: 25px; }
        .option.selected { background: rgba(212, 175, 55, 0.25); border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

        .nav-buttons { display: flex; justify-content: space-between; gap: 15px; }
        .btn-secondary {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold); box-shadow: none; flex: 1;
        }
        .btn-secondary:hover { background: rgba(212, 175, 55, 0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%);
            color: var(--dark-blue); flex: 1;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%); }

        /* Результаты */
        .result-screen { display: none; text-align: center; }
        .result-title { font-size: 30px; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .result-name { font-size: 18px; margin-bottom: 25px; color: #ddd; }

        .score-circle {
            width: 150px; height: 150px; border-radius: 50%;
            background: conic-gradient(var(--gold) 0deg, var(--red) 360deg);
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 30px; position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        .score-inner {
            width: 130px; height: 130px; border-radius: 50%;
            background: #0A1C3A; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .score-value { font-size: 48px; font-weight: 800; color: var(--gold); line-height: 1; }
        .score-label { font-size: 12px; color: #aaa; text-transform: uppercase; }

        .result-message {
            font-size: 18px; line-height: 1.6; margin-bottom: 30px;
            padding: 20px; background: rgba(212, 175, 55, 0.1);
            border-radius: 15px; border-left: 4px solid var(--gold);
        }
        .result-message strong { color: var(--gold); }

        /* Таблица лидеров */
        .leaderboard {
            margin-top: 40px; padding-top: 25px;
            border-top: 2px solid rgba(212, 175, 55, 0.3);
        }
        .leaderboard h2 {
            font-size: 20px; color: var(--gold); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 15px; text-align: center;
        }
        .leaderboard-table {
            width: 100%; border-collapse: collapse; font-size: 14px;
            background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 10px 12px; text-align: left;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .leaderboard-table th {
            background: rgba(212, 175, 55, 0.15); color: var(--gold);
            font-weight: 700; text-transform: uppercase; font-size: 12px;
        }
        .leaderboard-table tr:last-child td { border-bottom: none; }
        .leaderboard-table tr:hover td { background: rgba(212, 175, 55, 0.08); }

        .leaderboard-table .medal { font-size: 16px; margin-right: 5px; }
        .leaderboard-table .score-cell { font-weight: 700; color: var(--gold); }
        .leaderboard-table .date-cell { font-size: 12px; color: #aaa; }

        .leaderboard-empty {
            text-align: center; padding: 20px; color: #aaa; font-style: italic;
        }

        .export-buttons {
            display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap;
        }
        .btn-small {
            padding: 10px 16px; font-size: 13px; letter-spacing: 1px;
            background: rgba(255,255,255,0.1); color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-small:hover { background: rgba(212, 175, 55, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container { padding: 25px 20px; }
            h1 { font-size: 20px; }
            .question-text { font-size: 17px; }
            .btn { font-size: 16px; padding: 14px 20px; }
            .option { font-size: 14px; padding: 14px 16px; }
            .leaderboard-table th, .leaderboard-table td { padding: 8px 6px; font-size: 12px; }
        }

        .flag-stripe { display: flex; height: 6px; margin-top: 25px; border-radius: 3px; overflow: hidden; }
        .flag-stripe div { flex: 1; }
        .flag-stripe .white { background: white; }
        .flag-stripe .blue { background: #0039A6; }
        .flag-stripe .red { background: #D52B1E; }
    </style>
</head>
<body>

    <div class="bg-symbol left">🦅</div>
    <div class="bg-symbol right">🛡️</div>

    <div class="container">
        <header>
            <div class="emblem">🦅</div>
            <h1>День Государственного герба РФ</h1>
            <div class="subtitle">30 ноября — Символы России</div>
        </header>

        <!-- Экран регистрации -->
        <div id="registrationScreen" class="registration-form">
            <div class="input-group">
                <label for="firstName">Имя</label>
                <input type="text" id="firstName" placeholder="Введите имя" required>
            </div>
            <div class="input-group">
                <label for="lastName">Фамилия</label>
                <input type="text" id="lastName" placeholder="Введите фамилию" required>
            </div>
            <div class="input-group">
                <label for="classNum">Класс</label>
                <input type="text" id="classNum" placeholder="Например: 9А" required>
            </div>
            <button class="btn" id="startBtn">Начать викторину</button>
            <div class="flag-stripe">
                <div class="white"></div><div class="blue"></div><div class="red"></div>
            </div>
            <div class="leaderboard">
                <h2>🏆 Таблица лидеров</h2>
                <div id="leaderboardContent"></div>
            </div>
        </div>

        <!-- Экран викторины -->
        <div id="quizScreen" class="quiz-screen">
            <div class="quiz-header">
                <div class="user-info">👤 <span id="displayName">—</span></div>
                <div class="user-info">🏫 <span id="displayClass">—</span></div>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="question-number" id="questionNumber">Вопрос 1 из 12</div>
            <div class="question-text" id="questionText">—</div>
            <div class="options" id="optionsContainer"></div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
                <button class="btn btn-primary" id="nextBtn" disabled>Вперёд →</button>
            </div>
        </div>

        <!-- Экран результатов -->
        <div id="resultScreen" class="result-screen">
            <div class="emblem" style="font-size: 60px;">🏆</div>
            <div class="result-title">Викторина завершена!</div>
            <div class="result-name" id="resultName">—</div>
            <div class="score-circle">
                <div class="score-inner">
                    <div class="score-value" id="scoreValue">0</div>
                    <div class="score-label">из 12</div>
                </div>
            </div>
            <div class="result-message" id="resultMessage">—</div>
            <button class="btn" id="restartBtn">Пройти заново</button>
            <div class="flag-stripe" style="margin-top: 25px;">
                <div class="white"></div><div class="blue"></div><div class="red"></div>
            </div>

            <div class="leaderboard">
                <h2>🏆 Таблица лидеров</h2>
                <div id="leaderboardContentResult"></div>
                <div class="export-buttons">
                    <button class="btn-small" id="exportBtn">📥 Экспорт результатов</button>
                    <button class="btn-small" id="importBtn">📤 Импорт результатов</button>
                    <button class="btn-small" id="clearBtn" style="color: #ff6b6b;">🗑 Очистить</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <script>
        // --- Вопросы ко Дню Герба РФ (30 ноября) ---
        const questions = [
            {
                text: "Какого числа в России отмечается День Государственного герба?",
                options: ["12 июня", "30 ноября", "9 мая", "4 ноября"],
                correct: 1
            },
            {
                text: "Что изображено на Государственном гербе Российской Федерации?",
                options: ["Серп и молот", "Двуглавый орёл", "Медведь", "Святой Георгий на коне"],
                correct: 1
            },
            {
                text: "Сколько голов у орла на гербе России?",
                options: ["Одна", "Две", "Три", "Четыре"],
                correct: 1
            },
            {
                text: "Что держит двуглавый орёл на гербе России?",
                options: ["Меч и щит", "Скипетр и державу", "Лавровый венок", "Флаг и знамя"],
                correct: 1
            },
            {
                text: "В каком году Государственный герб РФ был утверждён в современном виде?",
                options: ["1991 год", "1993 год", "2000 год", "2014 год"],
                correct: 1
            },
            {
                text: "Какая фигура изображена на щите, который держит орёл?",
                options: ["Святой Георгий Победоносец", "Александр Невский", "Дмитрий Донской", "Иван Грозный"],
                correct: 0
            },
            {
                text: "Кто изображён на щите герба: змей или дракон?",
                options: ["Змей", "Дракон", "Оба", "Никто"],
                correct: 0
            },
            {
                text: "Какой документ утверждает описание Государственного герба РФ?",
                options: ["Конституция РФ", "Федеральный конституционный закон", "Указ Президента", "Постановление Правительства"],
                correct: 1
            },
            {
                text: "Какого цвета щит на Государственном гербе РФ?",
                options: ["Синий", "Красный", "Золотой", "Зелёный"],
                correct: 1
            },
            {
                text: "Что означает двуглавый орёл на гербе?",
                options: ["Силу и мощь", "Единство Востока и Запада", "Победу над врагом", "Мудрость и знания"],
                correct: 1
            },
            {
                text: "С какого времени двуглавый орёл стал символом Руси?",
                options: ["С IX века", "С XV века (при Иване III)", "С XVIII века", "С XX века"],
                correct: 1
            },
            {
                text: "Что символизируют скипетр и держава в лапах орла?",
                options: ["Богатство и власть", "Государственную власть и единство", "Военную силу", "Торговлю и ремёсла"],
                correct: 1
            }
        ];

        // --- Состояние ---
        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let userData = { firstName: '', lastName: '', className: '' };
        let quizCompleted = false;

        // --- DOM ---
        const regScreen = document.getElementById('registrationScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const startBtn = document.getElementById('startBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const questionText = document.getElementById('questionText');
        const questionNumber = document.getElementById('questionNumber');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressBar = document.getElementById('progressBar');
        const displayName = document.getElementById('displayName');
        const displayClass = document.getElementById('displayClass');
        const resultName = document.getElementById('resultName');
        const scoreValue = document.getElementById('scoreValue');
        const resultMessage = document.getElementById('resultMessage');
        const leaderboardContent = document.getElementById('leaderboardContent');
        const leaderboardContentResult = document.getElementById('leaderboardContentResult');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const clearBtn = document.getElementById('clearBtn');
        const importFile = document.getElementById('importFile');

        // --- localStorage ---
        const STORAGE_KEY = 'gerb_quiz_results';

        function getResults() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveResult(result) {
            const results = getResults();
            results.push(result);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
        }

        function clearResults() { localStorage.removeItem(STORAGE_KEY); }

        // --- Таблица лидеров ---
        function renderLeaderboard(container) {
            const results = getResults();

            if (results.length === 0) {
                container.innerHTML = '<div class="leaderboard-empty">Пока никто не проходил викторину. Будьте первым!</div>';
                return;
            }

            results.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return new Date(b.date) - new Date(a.date);
            });

            let html = '<table class="leaderboard-table"><thead><tr>' +
                '<th>#</th><th>Участник</th><th>Класс</th><th>Счёт</th><th>Дата</th>' +
                '</tr></thead><tbody>';

            results.forEach((r, index) => {
                let medal = '';
                if (index === 0) medal = '🥇 ';
                else if (index === 1) medal = '🥈 ';
                else if (index === 2) medal = '🥉 ';

                const date = new Date(r.date);
                const dateStr = date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' }) +
                    ' ' + date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                html += `<tr>
                    <td>${medal}${index + 1}</td>
                    <td>${r.lastName} ${r.firstName}</td>
                    <td>${r.className}</td>
                    <td class="score-cell">${r.score} / ${questions.length}</td>
                    <td class="date-cell">${dateStr}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderAllLeaderboards() {
            renderLeaderboard(leaderboardContent);
            renderLeaderboard(leaderboardContentResult);
        }

        // --- Регистрация ---
        startBtn.addEventListener('click', () => {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const className = document.getElementById('classNum').value.trim();

            if (!firstName || !lastName || !className) {
                alert('Пожалуйста, заполните все поля: Имя, Фамилия и Класс.');
                return;
            }

            userData = { firstName, lastName, className };
            displayName.textContent = `${lastName} ${firstName}`;
            displayClass.textContent = `${className} класс`;

            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            quizCompleted = false;

            regScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            resultScreen.style.display = 'none';

            renderQuestion();
        });

        // --- Вопрос ---
        function renderQuestion() {
            const q = questions[currentQuestion];
            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            progressBar.style.width = progressPercent + '%';

            questionNumber.textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
            questionText.textContent = q.text;

            optionsContainer.innerHTML = '';
            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                if (userAnswers[currentQuestion] === index) div.classList.add('selected');
                div.textContent = option;
                div.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(div);
            });

            prevBtn.disabled = currentQuestion === 0;
            updateNextButton();
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
            updateNextButton();
        }

        function updateNextButton() {
            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = 'Завершить';
                nextBtn.disabled = userAnswers[currentQuestion] === null;
            } else {
                nextBtn.textContent = 'Вперёд →';
                nextBtn.disabled = userAnswers[currentQuestion] === null;
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
        });

        nextBtn.addEventListener('click', () => {
            if (userAnswers[currentQuestion] === null) return;
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        });

        // --- Результаты ---
        function showResults() {
            if (quizCompleted) return;
            quizCompleted = true;

            let score = 0;
            userAnswers.forEach((answer, index) => {
                if (answer === questions[index].correct) score++;
            });

            const result = {
                firstName: userData.firstName,
                lastName: userData.lastName,
                className: userData.className,
                score: score,
                total: questions.length,
                date: new Date().toISOString()
            };
            saveResult(result);

            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';

            resultName.textContent = `${userData.lastName} ${userData.firstName}, ${userData.className} класс`;

            let currentDisplay = 0;
            const interval = setInterval(() => {
                if (currentDisplay >= score) {
                    scoreValue.textContent = score;
                    clearInterval(interval);
                } else {
                    currentDisplay++;
                    scoreValue.textContent = currentDisplay;
                }
            }, 80);

            let message = '';
            if (score === 12) message = '🌟 <strong>Великолепно!</strong> Вы настоящий знаток Государственного герба России!';
            else if (score >= 10) message = '🏅 <strong>Отличный результат!</strong> Вы хорошо знаете символы своей страны.';
            else if (score >= 7) message = '📚 <strong>Хороший результат!</strong> Есть куда расти — изучайте историю герба!';
            else if (score >= 4) message = '💡 <strong>Неплохо!</strong> Но стоит освежить знания о государственных символах.';
            else message = '📖 <strong>Не расстраивайтесь!</strong> Каждый день — повод узнать что-то новое о России.';
            resultMessage.innerHTML = message;

            nextBtn.textContent = 'Вперёд →';
            renderAllLeaderboards();
        }

        // --- Перезапуск ---
        restartBtn.addEventListener('click', () => {
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            quizCompleted = false;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            renderQuestion();
        });

        // --- Экспорт / Импорт / Очистка ---
        exportBtn.addEventListener('click', () => {
            const results = getResults();
            if (results.length === 0) {
                alert('Нет данных для экспорта.');
                return;
            }
            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `герб_викторина_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        importBtn.addEventListener('click', () => importFile.click());

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (!Array.isArray(imported)) throw new Error('Неверный формат');
                    const existing = getResults();
                    const key = (r) => `${r.lastName}|${r.firstName}|${r.className}|${r.date}`;
                    const existingKeys = new Set(existing.map(key));
                    const merged = [...existing];
                    imported.forEach(r => {
                        if (!existingKeys.has(key(r))) {
                            merged.push(r);
                            existingKeys.add(key(r));
                        }
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
                    renderAllLeaderboards();
                    alert(`Импортировано ${imported.length} записей. Всего: ${merged.length}.`);
                } catch (err) {
                    alert('Ошибка импорта: ' + err.message);
                }
            };
            reader.readAsText(file);
            importFile.value = '';
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите удалить все результаты?')) {
                clearResults();
                renderAllLeaderboards();
            }
        });

        // --- Инициализация ---
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        renderAllLeaderboards();
    </script>
</body>
</html>
